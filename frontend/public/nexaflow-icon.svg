<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="0.55" stop-color="#0B1440"/>
      <stop offset="1" stop-color="#060A26"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0.82" cy="0.88" r="0.65">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.2" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#2F8BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="350" y1="730" x2="674" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="0.5" stop-color="#5FD0FF"/>
      <stop offset="1" stop-color="#9A7BFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#9A7BFF" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02051A" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="228"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="960" height="960" fill="url(#blueGlow)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#violetGlow)"/>
    <!-- Glass sheen -->
    <path d="M32 32 H992 V470 C800 540 500 520 32 400 Z" fill="url(#glass)"/>
  </g>
  <rect x="35" y="35" width="954" height="954" rx="225" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- N glow -->
  <path d="M350 730 V294 L674 730 V294" fill="none" stroke="url(#stroke)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.65"/>

  <!-- N flow path -->
  <g filter="url(#shadow)">
    <path d="M350 730 V294 L674 730 V294" fill="none" stroke="url(#stroke)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Inner highlight line for depth -->
  <path d="M350 730 V294 L674 730 V294" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes -->
  <circle cx="350" cy="730" r="40" fill="#0B1440"/>
  <circle cx="350" cy="730" r="22" fill="#FFFFFF"/>
  <circle cx="674" cy="294" r="40" fill="#0B1440"/>
  <circle cx="674" cy="294" r="22" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="26" fill="#0B1440"/>
  <circle cx="512" cy="512" r="13" fill="#FFFFFF"/>
</svg>
